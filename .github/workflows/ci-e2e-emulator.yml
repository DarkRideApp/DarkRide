# Nightly E2E for emulator capture.
#
# Validates the full chain:
#   1. Build the fixture APK (tests/e2e/fixtures/hello-world)
#   2. Spawn a docker-android container via DarkRide's API
#   3. Install the APK, launch it
#   4. Assert the captured traffic shows the expected request
#
# Triggered by:
#   - schedule (02:17 UTC nightly) — keeps the chain warm
#   - workflow_dispatch — for manual validation before merging
#
# NOT triggered on every PR — emulator boot adds ~10 min and the standard
# CI catches everything that doesn't require a real emulator.

name: E2E — emulator capture

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

env:
  # Opt JS-based actions onto Node 24 ahead of GitHub's forced switch.
  # Matches the existing ci.yml convention.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read
  packages: read

concurrency:
  group: e2e-emulator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # 1. Enable KVM so the emulator can use hardware acceleration.
      #    Without this, the emulator runs in software mode and may not
      #    boot within the workflow timeout.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 2. JDK 17 + Android SDK to build the fixture APK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      # 3. Build the fixture APK. Cached separately from npm install.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-e2e-fixture-${{ hashFiles('tests/e2e/fixtures/hello-world/**/*.gradle.kts', 'tests/e2e/fixtures/hello-world/gradle.properties') }}
          restore-keys: |
            gradle-e2e-fixture-

      - name: Build fixture APK
        working-directory: tests/e2e/fixtures/hello-world
        run: |
          gradle wrapper --gradle-version 8.10
          ./gradlew assembleDebug --no-daemon

      - name: Verify fixture APK exists
        run: |
          test -f tests/e2e/fixtures/hello-world/app/build/outputs/apk/debug/app-debug.apk \
            || { echo "::error::fixture APK build did not produce app-debug.apk"; exit 1; }

      # 4. Node 24 + npm install + SDK build (same pattern as ci.yml).
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Node dependencies
        run: npm ci

      - name: Build plugin SDK
        run: npm run build -w @darkrideapp/plugin-sdk

      # 5. Authenticate to ghcr.io so docker pull can fetch the (private-by-default)
      #    package. The workflow's `packages: read` permission grants the
      #    GITHUB_TOKEN scope; this step trades it for a docker login.
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6. Pull the docker-android image (cached).
      - name: Cache docker-android image
        uses: actions/cache@v4
        id: image-cache
        with:
          path: /tmp/docker-image-cache
          key: docker-android-14-${{ hashFiles('docker/Dockerfile.android-emulator') }}

      - name: Pull or restore docker-android:14
        run: |
          mkdir -p /tmp/docker-image-cache
          if [ -f /tmp/docker-image-cache/docker-android-14.tar ]; then
            echo "Restoring image from cache"
            docker load -i /tmp/docker-image-cache/docker-android-14.tar
          else
            echo "Pulling fresh image from ghcr.io"
            docker pull ghcr.io/darkrideapp/docker-android:14
            docker save ghcr.io/darkrideapp/docker-android:14 -o /tmp/docker-image-cache/docker-android-14.tar
          fi

      # 6. Start DarkRide backend in the background.
      #    Backend-only (no frontend) — the E2E hits the REST API on :3001
      #    directly. `npm run dev` also boots the Vite dev server which
      #    pre-bundles deps that may not be present in CI (e.g. leaflet
      #    used by the Maps plugin); we skip that here.
      # Pre-warm the Python venv so DarkRide's first-boot Python bridge
      # setup is a no-op (the venv directory check skips creation when
      # the python binary already exists). Boot time observations went
      # 245s → 363s → 606s across runs without this prewarm — pip + mitmproxy
      # + frida wheel builds are the dominant cost. Pre-warming flips them
      # from the boot critical path to a cached workflow step (~90s, then
      # ~5s on subsequent runs via actions/cache).
      - name: Cache Python venv
        uses: actions/cache@v4
        id: venv-cache
        with:
          path: .venv
          key: python-venv-${{ hashFiles('python/requirements.txt') }}

      - name: Pre-warm Python venv
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r python/requirements.txt

      - name: Start DarkRide backend
        env:
          # DarkRide defaults to PORT=3000; the E2E test (and the curl
          # health probe below) expects :3001. Set it explicitly so the
          # two halves agree.
          PORT: '3001'
        run: |
          PORT=3001 npx tsx backend/index.ts > /tmp/darkride.log 2>&1 &
          echo $! > /tmp/darkride.pid
          # Wait until the API responds. Cold boot in CI does:
          #   - core db migrations
          #   - plugin discovery + migrations + reconcile
          #   - provider isAvailable checks (some shell out)
          #   - Python bridge venv creation + pip install (~60-90s)
          # Allow up to 10 minutes — the Python setup dominates.
          # Observed ~363s in CI; 600s gives ~65% margin for slow runners.
          for i in {1..300}; do
            if curl -fsS http://localhost:3001/v1/system/health >/dev/null 2>&1; then
              echo "DarkRide ready after ${i}*2s"
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:3001/v1/system/health || {
            echo "::error::DarkRide did not respond on :3001 within 600s"
            tail -300 /tmp/darkride.log
            exit 1
          }

      # 7. Bootstrap an admin user + API key.
      #    DarkRide's scoped endpoints reject unauthenticated requests;
      #    the E2E uses an API key passed via Authorization header. We
      #    extract the bootstrap token from the boot log, POST to
      #    /v1/auth/setup to create the first admin, then POST to
      #    /v1/api-keys to mint a long-lived key with the scopes the test
      #    needs.
      - name: Provision admin + API key for E2E
        run: |
          # Extract bootstrap token from "http://...:3001/ui/setup?token=<hex>"
          TOKEN=$(grep -oE 'token=[a-f0-9]+' /tmp/darkride.log | head -1 | cut -d= -f2)
          if [ -z "$TOKEN" ]; then
            echo "::error::Could not extract bootstrap token from DarkRide log"
            tail -300 /tmp/darkride.log
            exit 1
          fi
          # Create the first admin. Response includes csrfToken and a Set-Cookie
          # we capture for follow-up authenticated requests.
          curl -fsS -c /tmp/darkride-cookies.txt \
            -X POST http://localhost:3001/v1/auth/setup \
            -H 'Content-Type: application/json' \
            -d "{\"token\":\"$TOKEN\",\"username\":\"e2e-admin\",\"password\":\"e2e-test-only-12345\"}" \
            > /tmp/setup-response.json
          CSRF=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/setup-response.json','utf8')).csrfToken)")
          # Create a long-lived API key with the scopes the E2E needs.
          # Endpoint: POST /v1/profile/api-keys with { name, scopes[] }; 201 response.
          # Scopes: core.devices:manage (provider endpoints), core.traffic:manage (capture endpoints).
          curl -fsS -b /tmp/darkride-cookies.txt \
            -X POST http://localhost:3001/v1/profile/api-keys \
            -H 'Content-Type: application/json' \
            -H "X-CSRF-Token: $CSRF" \
            -d '{"name":"e2e-test","scopes":["core.devices:manage","core.traffic:manage"]}' \
            > /tmp/key-response.json
          API_KEY=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/key-response.json','utf8')).data.key)")
          if [ -z "$API_KEY" ]; then
            echo "::error::Could not mint API key"
            cat /tmp/key-response.json
            exit 1
          fi
          echo "DARKRIDE_API_KEY=$API_KEY" >> "$GITHUB_ENV"
          echo "::notice::E2E admin + API key provisioned"

      # 7. Run the E2E test with retry-once on boot failure.
      #    The flake mitigation: if the FIRST attempt fails, wait 30s and
      #    retry exactly once. Per the spec's documented ~5-10% hosted-runner
      #    emulator flake rate.
      - name: Run E2E test (retry-once on failure)
        env:
          DARKRIDE_HOST: http://localhost:3001
        run: |
          set +e
          npx vitest run tests/e2e/emulator-capture.test.ts
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::warning::E2E first attempt failed (likely emulator boot flake); retrying once..."
            sleep 30
            # Clean up any lingering containers from the failed attempt
            docker ps -aq --filter "label=darkride.emulator=true" | xargs -r docker rm -f
            npx vitest run tests/e2e/emulator-capture.test.ts
            rc=$?
          fi
          exit $rc

      # 8. Capture DarkRide log + container state for post-mortem on failure.
      - name: Collect diagnostics (always)
        if: always()
        run: |
          echo "===== DarkRide log (last 200 lines) ====="
          tail -200 /tmp/darkride.log || true
          echo ""
          echo "===== Lingering containers ====="
          docker ps -a --filter "label=darkride.emulator=true" || true

      # 9. Tear down DarkRide + any leaked containers.
      - name: Cleanup
        if: always()
        run: |
          if [ -f /tmp/darkride.pid ]; then
            kill -TERM "$(cat /tmp/darkride.pid)" 2>/dev/null || true
          fi
          docker ps -aq --filter "label=darkride.emulator=true" | xargs -r docker rm -f
