# Build + publish ghcr.io/darkrideapp/docker-android:<android-version>
# Triggered on push to main when docker/** paths change, or via
# manual workflow_dispatch. NOT fired automatically on every CI run —
# the image is published as an artifact, not gating any other build.

name: Publish docker-android image

on:
  push:
    branches: [main]
    paths:
      - 'docker/Dockerfile.android-emulator'
      - 'docker/entrypoint.sh'
      - '.github/workflows/publish-docker-android.yml'
  workflow_dispatch:
    inputs:
      android_version:
        description: 'Android version to build (e.g. 14, 13, 12)'
        required: true
        default: '14'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  REGISTRY: ghcr.io
  IMAGE_NAME: darkrideapp/docker-android

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        android_version:
          - '14'
          - '13'
          - '12'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/Dockerfile.android-emulator
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.android_version }}
          build-args: |
            BUDTMO_VERSION=${{ matrix.android_version }}.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
