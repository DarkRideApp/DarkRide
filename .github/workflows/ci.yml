name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Opt JavaScript-based actions (checkout/setup-node/setup-python) onto the
  # Node 24 runtime ahead of GitHub's forced switch on 2026-06-02.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# All jobs only read source code; none push, comment, or modify GitHub state.
# Setting top-level permissions to read-only follows least-privilege for the
# GITHUB_TOKEN (CodeQL js/actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  lockfile-hygiene:
    name: Lockfile hygiene (workspaces match repo)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      # The plugins/* workspace glob in package.json pulls any plugin
      # checked into plugins/ into package-lock.json. The only public
      # in-tree plugin is kitchen-sink — anything else (symlinked plugin
      # under active development, scratch clones) leaks names and version
      # numbers into the committed lockfile. Fail the build if any
      # plugins/* workspace other than kitchen-sink appears.
      - name: Check package-lock.json for unexpected plugin workspaces
        run: |
          # Match actual workspace package nodes (`"plugins/<name>": {`),
          # not the workspaces glob (`"plugins/*"`) or other quoted refs.
          suspicious=$(grep -E '^\s*"plugins/[^"*]+": \{' package-lock.json | grep -v '"plugins/kitchen-sink"' || true)
          if [ -n "$suspicious" ]; then
            echo "::error::package-lock.json contains plugin workspaces other than kitchen-sink. Don't commit the lockfile while non-public plugins are linked in plugins/. See docs/development.md."
            echo "$suspicious"
            exit 1
          fi
          echo "Lockfile workspace set: kitchen-sink only ✓"

  backend:
    name: Backend (typecheck + tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      # The root tsconfig's `paths` mapping for @darkrideapp/plugin-sdk
      # resolves to packages/plugin-sdk/dist/*. Build the SDK so those
      # type files exist before `tsc --noEmit` and the test suite run.
      - name: Build plugin SDK
        run: npm run build -w @darkrideapp/plugin-sdk

      - name: Type check
        run: npx tsc --noEmit

      # Skip the typecheck embedded in `npm run test` — the dedicated Type
      # check step above already ran it, and rerunning costs ~30s per build.
      - name: Backend unit tests
        run: npx vitest run

      - name: Build
        run: npm run build

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      # Vite needs to resolve @darkrideapp/plugin-sdk/react via the SDK's
      # built dist/ — the package.json `exports` map points there. Build
      # the SDK first so the frontend tests can import it.
      - name: Build plugin SDK
        run: npm run build -w @darkrideapp/plugin-sdk

      - name: Frontend tests
        run: npm run test:frontend

  python:
    name: Python bridge tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: python/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r python/requirements.txt
          .venv/bin/pip install pytest

      - name: Python tests
        run: .venv/bin/python -m pytest python/ -v

  docker:
    name: Docker image (build + smoke + publish on main)
    needs: [backend, frontend, python]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The smoke step starts a container and curls a public endpoint —
    # straightforward read-only on GITHUB_TOKEN. The push step needs
    # `packages: write` to publish to ghcr.io. Both scopes are scoped
    # to THIS job rather than workflow-wide so the test/build jobs
    # above keep their read-only token.
    permissions:
      contents: read
      packages: write
    env:
      # OCI/Docker registry names must be lowercase. github.repository_owner
      # returns "DarkRideApp" (mixed case), which Docker rejects. Hardcode the
      # lowercased form — the org name is fixed.
      IMAGE: ghcr.io/darkrideapp/darkride
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only authenticate to ghcr.io on push events. On PRs from forks
      # the GITHUB_TOKEN can't write to packages anyway; on PRs from
      # branches in this repo we still skip the push to avoid burning
      # registry space on doomed branches.
      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "sha_short=$SHA_SHORT" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ]; then
            # On main, tag both 'latest' and 'sha-<7chars>' — sha tags
            # make rollback to a specific build trivial; latest is the
            # convenience tag for fresh-VM smoke testing.
            echo "tags=${IMAGE}:latest,${IMAGE}:sha-${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          else
            # On PRs, build but don't push. Tag locally so the smoke
            # step can `docker run` it.
            echo "tags=darkride:pr-${{ github.event.pull_request.number || 'local' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          # `load: true` puts the image into the local docker daemon so
          # the smoke step below can `docker run` it. Works because
          # we're single-platform (linux/amd64); multi-arch would need
          # a separate flow.
          load: true
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only

      # Smoke test: start the just-built image, poll the API for the
      # expected 401 (auth gate is alive), then clean up. This is the
      # check that catches "image builds but crashes on boot" — exactly
      # the bug fixed in c417561 that was silent until manual smoke
      # testing surfaced it.
      - name: Smoke test (boot + auth gate)
        run: |
          set -e
          # Pick the first tag from the comma-separated list — works
          # for both the push case (ghcr.io/.../darkride:latest) and the
          # PR case (darkride:pr-N).
          IMAGE_TAG=$(echo "${{ steps.tags.outputs.tags }}" | cut -d, -f1)
          echo "Smoke-testing $IMAGE_TAG"

          docker run -d --name smoke \
            -p 13000:3000 \
            -e HOST=0.0.0.0 \
            -e DARKRIDE_BOOTSTRAP_ADMIN_USERNAME=smoke \
            -e DARKRIDE_BOOTSTRAP_ADMIN_PASSWORD=smoke-pw-at-least-12-chars \
            "$IMAGE_TAG"

          # Poll for up to 60s waiting for the server to come up. We
          # expect 401 from /v1/system/status — that proves auth is
          # mounted and the server is serving. 000 means not yet
          # listening; 5xx would mean a real error.
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:13000/v1/system/status || true)
            if [ "$CODE" = "401" ]; then
              echo "✓ Server up, auth gate enforcing (HTTP $CODE) after ${i}x2s"
              docker logs smoke 2>&1 | tail -15
              docker rm -f smoke >/dev/null
              exit 0
            fi
            sleep 2
          done

          echo "::error::Smoke test failed — server did not return 401 within 60s"
          docker logs smoke 2>&1 | tail -50
          docker rm -f smoke >/dev/null
          exit 1
